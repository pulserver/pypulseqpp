name: Release

# Publishes a tagged version: the wheels and sdist from the reusable Wheels
# workflow, then PyPI and a signed GitHub release. The version comes from the
# tag via setuptools_scm.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    uses: ./.github/workflows/wheels.yml
    with:
      cibw-build: "cp310-* cp311-* cp312-* cp313-*"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install '.[examples]'
      - run: bash scripts/build_docs_pdf.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pypulseqpp-docs-pdf
          path: docs/build/pypulseqpp-docs.pdf

  publish-to-pypi:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pypulseqpp
    permissions:
      id-token: write # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish-to-pypi, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sigstore
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: pypulseqpp-docs-pdf
          path: dist
      - uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: |
            ./dist/*.tar.gz
            ./dist/*.whl
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        # A release drafted on the GitHub page creates the tag and the release
        # together, so the release can already exist when this runs: attach
        # the signed distributions to it and keep its notes.
        run: |
          if gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' > /dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} exists; attaching the distributions to it"
          else
            gh release create '${{ github.ref_name }}' \
              --repo '${{ github.repository }}' \
              --title '${{ github.ref_name }}' \
              --generate-notes
          fi
          gh release upload '${{ github.ref_name }}' dist/** --repo '${{ github.repository }}' --clobber
