name: Docs

# Builds the documentation and publishes it to GitHub Pages. The site is
# versioned under one branch: main publishes `latest`, a release tag publishes
# `vX.Y.Z`, and docs/conf.py stamps the matching canonical URL. Pull requests
# build without publishing, so a documentation warning fails review rather
# than the site.

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every publish commits to the same gh-pages branch, so main, the tags and a
# manual run share one group and wait for each other rather than racing to push.
# A pull request publishes nothing and gets a group of its own.
concurrency:
  group: docs-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the publish step pushes the built site to gh-pages
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # the solver in external/ is compiled in
          fetch-depth: 0 # setuptools_scm reads the tags

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Name this version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        # Into the CMake build directory build_docs.sh uses, so the build it
        # makes for Sphinx reuses these objects rather than compiling twice.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -Cbuild-dir="$PWD/docs/build/cmake" '.[doc]'

      - name: Build
        env:
          PYPULSEQPP_DOCS_VERSION: ${{ steps.version.outputs.name }}
        run: bash scripts/build_docs.sh

      - name: Publish
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          site="$RUNNER_TEMP/pages"
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY"
          # The branch does not exist before the first publish.
          if ! git clone --depth 1 --branch gh-pages "$remote" "$site"; then
            git init -b gh-pages "$site"
            git -C "$site" remote add origin "$remote"
          fi

          # Only this version's directory is replaced; the others stay as the
          # release that built them left them.
          rm -rf "${site:?}/$VERSION"
          cp -r docs/build/html "$site/$VERSION"
          # Pages runs the branch through Jekyll unless told not to, and Jekyll
          # drops the _static and _sources directories Sphinx writes.
          touch "$site/.nojekyll"
          printf '<!doctype html>\n<meta http-equiv="refresh" content="0; url=latest/">\n' \
            > "$site/index.html"

          git -C "$site" add -A
          git -C "$site" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Documentation for $VERSION from $GITHUB_SHA" \
            || { echo "No documentation change to publish."; exit 0; }
          git -C "$site" push origin gh-pages
